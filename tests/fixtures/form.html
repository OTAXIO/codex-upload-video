<!doctype html><meta charset="utf-8"><title>Offline upload form fixture</title>
<style>.season-enter{min-height:24px;min-width:100px;border:1px solid #ddd}.hidden{display:none}.bcc-dialog{border:1px solid;padding:10px;background:white}.close{width:14px;height:14px;cursor:pointer}.season-dropdown,.bcc-select-list-wrap,.options,.setting,#cover-dialog{display:none}.topic-icon{display:inline-block;width:8px;height:8px;background:blue}.label-item-v2-container{display:inline-flex;gap:5px;padding:3px}.submit-add{padding:10px;border:1px solid;cursor:pointer}</style>
<div class="video-title"><input class="input-val" value="old title"></div>
<div class="creation-statement-container"><div class="bcc-select"><div class="bcc-select-input-wrap" onclick="toggle('.bcc-select-list-wrap')">声明<input class="bcc-select-input-inner" readonly></div><div class="bcc-select-list-wrap"><ul>
<li class="bcc-option selected"><span>内容无需标注</span></li><li class="bcc-option"><span>含AI生成内容</span></li><li class="bcc-option"><span>内容为转载</span></li>
<div class="auth-content"><span class="option-text">内容为自制：未经作者允许，禁止转载</span></div></ul></div></div></div>
<div class="video-human-type"><div class="select-controller" onclick="toggle('.options')">分区 <span class="select-item-cont">知识</span></div><div class="options"><div class="item-cont-main">科技数码</div><div class="item-cont-main">知识</div></div></div>
<div class="tag-container"><div class="tag-input-wrp"><div class="chips"></div><input class="input-val" placeholder="按回车键Enter创建标签"></div></div>
<div class="tag-topic-list"></div>
<div class="desc-container"><div class="ql-editor" contenteditable="true">old description</div></div>
<div class="video-season"><div class="season-enter" onclick="toggle('.season-dropdown')"><span class="season-enter-text" title="Other"><span class="season-enter-text-name">Other</span></span></div><div class="season-dropdown"><div class="season-item"><p class="season-item-title">News</p></div><div class="season-item"><p class="season-item-title">News</p></div><div class="season-item"><p class="season-item-title">Other</p></div></div></div>
<span class="label" onclick="toggle('.setting')">更多设置 <span class="des">（含声明与权益、视频元素、互动管理等）</span></span>
<div class="setting"><div class="check-radio-v2-container" onclick="setVisibility(this)"><span class="check-radio-v2-box-checked"></span><span class="check-radio-v2-name">公开可见</span></div><div class="check-radio-v2-container" onclick="setVisibility(this)"><span class="check-radio-v2-box"></span><span class="check-radio-v2-name">仅自己可见</span></div></div>
<div class="file-list-v2-item">offline.mp4 上传完成</div><div class="submit-container"><div class="submit-add" onclick="fetch('https://member.bilibili.com/x/vu/web/add/v3',{method:'POST'})">立即投稿</div></div>
<script>
function toggle(css){const e=document.querySelector(css);e.style.display=getComputedStyle(e).display==='none'?'block':'none'}
for(const e of document.querySelectorAll('.bcc-option'))e.onclick=()=>{document.querySelectorAll('.bcc-option').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');toggle('.bcc-select-list-wrap')};
document.querySelector('.auth-content').onclick=()=>document.querySelector('.option-text').classList.toggle('option-text-selected');
for(const e of document.querySelectorAll('.item-cont-main'))e.onclick=()=>{document.querySelector('.select-item-cont').textContent=e.textContent;toggle('.options')};
function addTag(text,topic=false){if([...document.querySelectorAll('.label-item-v2-content')].some(e=>e.textContent===text))return;const c=document.createElement('div');c.className='label-item-v2-container';if(topic){const i=document.createElement('span');i.className='topic-icon';c.append(i)}const p=document.createElement('p');p.className='label-item-v2-content';p.textContent=text;c.append(p);if(!topic){const x=document.createElementNS('http://www.w3.org/2000/svg','svg');x.classList.add('close');x.innerHTML='<rect width="14" height="14" fill="black"/>';x.onclick=()=>c.remove();c.append(x)}document.querySelector('.chips').append(c)}
addTag('unrelated');document.querySelector('.tag-input-wrp input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addTag(e.target.value,e.target.value==='明日方舟终末地创作者应援计划');e.target.value=''}};
for(const [i,name,views]of [[1,'AI栏目挑战','2万次播放'],[2,'科技猎手','9.6亿次播放'],[3,'生活打卡','99亿次播放']]){const e=document.createElement('span');e.setAttribute('v-model',i);e.innerHTML='<div class="des hidden">'+views+'</div><div class="hot-tag-container"><div class="hot-tag-item"><span>'+name+'</span></div></div>';e.querySelector('.hot-tag-container').onclick=()=>{const on=e.querySelector('.hot-tag-container').classList.toggle('hot-tag-container-selected');if(on)addTag(name,true);else[...document.querySelectorAll('.label-item-v2-content')].filter(p=>p.textContent===name).forEach(p=>p.parentElement.remove())};document.querySelector('.tag-topic-list').append(e)}
document.querySelectorAll('.season-item').forEach((e,i)=>e.onclick=()=>{const x=document.querySelector('.season-enter-text');const off=window.chosenCollectionIndex===i;x.title=off?'':e.innerText;x.querySelector('span').textContent=off?'':e.innerText;window.chosenCollectionIndex=off?null:i;toggle('.season-dropdown')});
function setVisibility(e){document.querySelectorAll('.check-radio-v2-container').forEach(x=>x.children[0].className='check-radio-v2-box');e.children[0].className='check-radio-v2-box-checked'}
</script>
